version: 2

updates:
  # JavaScript / TypeScript dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    cooldown:
      default-days: 7

    ignore: #keep within minor versions - eslint doesn't support >= 7 yet
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

    open-pull-requests-limit: 5

    groups:
      development-dependencies:
        dependency-type: "development"

    commit-message:
      prefix: "deps"

  # GitHub Actions themselves
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

    commit-message:
      prefix: "ci"
